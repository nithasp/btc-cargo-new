<div class="lang-switch">
  <button
    type="button"
    class="lang-wrapper"
    [class.active]="currentLang === 'en'"
    [attr.aria-pressed]="currentLang === 'en'"
    (click)="toggleLang('en')"
  >
    <img
      src="assets/img/flag/Flag_of_the_United_States.svg.png"
      class="flag-navbar"
      width="20"
      height="15"
      alt=""
    />
    <span class="lang">EN</span>
  </button>
  <button
    type="button"
    class="lang-wrapper"
    [class.active]="currentLang === 'th'"
    [attr.aria-pressed]="currentLang === 'th'"
    (click)="toggleLang('th')"
  >
    <img
      src="assets/img/flag/Flag_of_Thailand.svg.webp"
      class="flag-navbar"
      width="20"
      height="15"
      alt=""
    />
    <span class="lang">TH</span>
  </button>
</div>
