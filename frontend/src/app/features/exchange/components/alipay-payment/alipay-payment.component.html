<div>
  <div *ngIf="formState === 'selectAccount'">
    <div>
      <h4>{{ "exchange.alipay_details_prompt" | transloco }}</h4>
      <h4 class="text-danger">
        {{ "exchange.alipay_limit_note" | transloco }}
      </h4>
      <h4>
        <a href="javascript:void()" target="_blank"> {{ "exchange.alipay_how_to_request" | transloco }} </a>
      </h4>
      <h4>
        <a href="javascript:void()" target="_blank"> {{ "exchange.alipay_how_to_verify" | transloco }} </a>
      </h4>
      <h4 class="mt-3 mb-3">{{ "exchange.alipay_select_account" | transloco }}</h4>
      <div *ngFor="let account of accounts" class="custom-control custom-radio">
        <input
          type="radio"
          id="customRadio-{{ account.id }}"
          name="customRadio-{{ account.id }}"
          class="custom-control-input"
          [value]="account.id"
          [(ngModel)]="selectedAccountId"
        />
        <label class="custom-control-label" for="customRadio-{{ account.id }}"
          >{{ account.name }}
        </label>
      </div>
    </div>
    <div class="button-container">
      <button class="btn btn-danger mr-2" type="button" (click)="onCancel()">
        {{ "cancel" | transloco }}
      </button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="handleNextFormState()"
      >
        {{ "continue" | transloco }}
      </button>
    </div>
  </div>
  <payment-details *ngIf="formState === 'paymentDetails'"> </payment-details>
</div>
